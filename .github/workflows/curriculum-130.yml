name: Tablinum 130-chapter vocabulary roadmap validation

on:
  push:
    branches:
      - plan/latin-3000-word-curriculum-20261105
      - fix/tablinum-curriculum-v2-20261105
      - fix/tablinum-curriculum-v3-pronouns-20261105
  workflow_dispatch:

jobs:
  validate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check existing application regression and manuscript integrity
        run: npm test
      - name: Verify original 50-chapter DCC seed audit (historical)
        run: node curriculum/validate-outline-50.cjs
      - name: Validate 130-chapter roadmap and honest lexeme audit
        run: node curriculum/validate-roadmap-130.cjs
      - name: Validate Claude curriculum review v2 corrections
        run: node curriculum/validate-outline-v2.cjs
      - name: Validate Claude curriculum follow-up v3 corrections
        run: node curriculum/validate-outline-v3.cjs
      - name: Confirm strict 1500 gate remains unmet until content exists
        shell: bash
        run: |
          if node curriculum/validate-roadmap-130.cjs --require-introduced-1500 > /tmp/tablinum-strict.log 2>&1; then
            echo 'ERROR: strict word-coverage gate passed without 1500 approved lessons'
            exit 1
          fi
          grep -q 'GATE NOT MET' /tmp/tablinum-strict.log
          echo 'PASS: strict gate correctly rejects unsupported 1500-word completion claim'

      - name: Report actual Node course-plan validation result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ job.status }}
        shell: bash
        run: |
          if [ "$TEST_RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="tablinum/curriculum-130" \
            -f description="Node 22 source and vocabulary plan validation" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
