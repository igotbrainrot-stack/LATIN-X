name: Tablinum offline legacy lexeme audit

on:
  push:
    branches:
      - feature/legacy-lexeme-audit-20261105
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Legacy eight-chapter application regression
        run: npm test
      - name: Rebuild lexical report and compare snapshots exactly
        run: node scripts/build-legacy-lexeme-audit.cjs --check
      - name: Verify stable IDs, saved-state keys and zero mastered lexemes
        run: node tests/legacy-lexeme-audit.test.cjs
      - name: Check 130-chapter course arithmetic and honest introduction ledger
        run: node curriculum/validate-roadmap-130.cjs
      - name: Check latest lesson-plan review
        run: node curriculum/validate-outline-v3.cjs
      - name: Confirm strict 1500-lemma claim still fails
        run: |
          if node curriculum/validate-roadmap-130.cjs --require-introduced-1500 >/tmp/strict.log 2>&1; then
            echo 'ERROR: strict 1500 gate unexpectedly passed' >&2
            exit 1
          fi
          grep -q 'GATE NOT MET' /tmp/strict.log
          echo 'PASS: 1500-word gate correctly rejects unverified counts'
      - name: Publish pass/fail status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ job.status }}
        run: |
          if [ "$TEST_RESULT" = "success" ]; then state=success; else state=failure; fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context="tablinum/lexeme-audit" \
            -f description="Offline lexical audit and legacy progress-ID snapshot" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
