name: LATIN X Phase 6 FSRS review and full Claude ZIP
on:
  push:
    branches: [feature/phase6-fsrs-owner-audio-20261106]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install EXACT published pinned FSRS library
        run: npm install --no-save ts-fsrs@5.4.2
      - name: Vendor actual MIT UMD for offline file URL program
        run: |
          npm run vendor:fsrs
          npm run test:vendor-fsrs
      - name: Run full legacy and approved-only Phase6 regression checks
        run: |
          npm test
          npm run test:phase6
          npm run test:phase5
          npm run test:phase3c
          npm run test:phase2
          npm run test:pilot
          npm run test:lexemes
          npm run test:package
          python3 scripts/check-claude-pilot.py
      - name: Verify milestones remain explicitly RED
        shell: bash
        run: |
          if node scripts/validate-lexemes.cjs --require-review-ready > review-gate.txt 2>&1; then exit 1; fi
          for n in 1500 3000; do
            if node curriculum/validate-roadmap-130.cjs --require-introduced-$n > gate-$n.txt 2>&1; then exit 1; fi
            grep -q 'GATE NOT MET' gate-$n.txt
          done
      - name: Commit vendored real library and its MIT license after passing
        shell: bash
        run: |
          git config user.name 'LATIN X CI'
          git config user.email 'actions@users.noreply.github.com'
          git add vendor/ts-fsrs.umd.js vendor/ts-fsrs.LICENSE vendor/ts-fsrs-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "build(phase6): vendor pinned ts-fsrs 5.4.2 MIT offline library"
            git push origin HEAD:feature/phase6-fsrs-owner-audio-20261106
          fi
      - name: Build COMPLETE runnable source + Claude review ZIP
        shell: bash
        run: |
          mkdir -p dist
          git archive --format=zip --output=dist/LATIN_X_PHASE6_COMPLETE_CLAUDE_REVIEW.zip HEAD
          unzip -t dist/LATIN_X_PHASE6_COMPLETE_CLAUDE_REVIEW.zip | tail -n 1
          for file in index.html 'Start Tablinum.cmd' vendor/ts-fsrs.umd.js vendor/ts-fsrs.LICENSE app/55-review-deck.js lessons/b01/c001.json lessons/b01/c008.json PHASE6_CLAUDE_HANDOVER.md docs/owner/AUDIO_AND_ART_REQUIREMENTS.md; do
            unzip -Z1 dist/LATIN_X_PHASE6_COMPLETE_CLAUDE_REVIEW.zip | grep -Fx "$file"
          done
          sha256sum dist/LATIN_X_PHASE6_COMPLETE_CLAUDE_REVIEW.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: LATIN_X_PHASE6_COMPLETE_CLAUDE_REVIEW
          path: dist/
          if-no-files-found: error
          retention-days: 30
  windows:
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase6-fsrs-owner-audio-20261106
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned FSRS and stable Playwright
        run: |
          npm install --no-save ts-fsrs@5.4.2 playwright@1.64.1
          npx playwright install chromium
      - name: Test complete old app and FSRS state on Windows
        run: |
          npm run test:vendor-fsrs
          npm test
          npm run test:phase6
          npm run test:phase3c
          npm run test:pilot
      - name: Test real Windows file URL FSRS and keyboard ordering
        run: npm run test:phase6-browser
      - name: Test Phase5 reviewed-only exercise behavior
        run: npm run test:phase5-browser
      - name: Test old file URL historical progress and backups
        run: npm run test:file
      - name: Test vocabulary editor file URL
        run: npm run test:review-browser
      - name: Test responsive original HTTP browser layout
        run: npm run test:browser
