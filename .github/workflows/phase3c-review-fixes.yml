name: LATIN X Claude Phase 3c review fixes
on:
  push:
    branches:
      - content/pilot-b01-c001-c008
  workflow_dispatch:
permissions:
  contents: read
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm test
      - run: npm run test:phase3c
      - run: npm run test:phase2
      - run: npm run test:lexemes
      - name: Ensure curriculum approvals remain unaltered
        run: |
          node scripts/validate-lexemes.cjs --require-review-ready && exit 1 || true
          node curriculum/validate-roadmap-130.cjs --require-introduced-1500 && exit 1 || true
          node curriculum/validate-roadmap-130.cjs --require-introduced-3000 && exit 1 || true
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm test
      - run: npm install --no-save playwright@1.64.1
      - run: npx playwright install chromium
      - run: node tests/phase3c-review-browser.test.cjs
      - run: npm run test:file
      - run: npm run test:review-browser
