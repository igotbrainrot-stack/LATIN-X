case"market":art='<rect x="97" y="106" width="410" height="100" fill="#e0c6a3"/><path d="M87 106L123 65H475L513 106Z" fill="#c27962"/><path d="M133 66V106M221 66V106M309 66V106M397 66V106" stroke="#f1dfbe" stroke-width="20"/><rect x="136" y="143" width="321" height="20" fill="#9e7653"/><circle cx="232" cy="135" r="13" fill="#bdc975"/><circle cx="278" cy="135" r="13" fill="#c47764"/><circle cx="324" cy="135" r="13" fill="#c47764"/>';break;
case"dog":art=human(445,161,"#a87782",.88)+'<ellipse cx="187" cy="177" rx="54" ry="29" fill="#bd946c"/><circle cx="227" cy="152" r="25" fill="#bd946c"/><path d="M228 130L253 110 248 148" fill="#997453"/><path d="M146 176Q103 141 101 154" fill="none" stroke="#bd946c" stroke-width="12"/><path d="M159 190V220M206 190V220" stroke="#917153" stroke-width="11"/>';break;
case"rain":art=house+Array.from({length:27},(_,i)=>`<path d="M${(i*77)%560+15} ${(i*47)%155+5}l-10 20" stroke="#7c9ba6" stroke-width="3"/>`).join("");break;
case"journey":art=tree+'<path d="M229 245Q280 160 362 184T495 130" fill="none" stroke="#d7c1a0" stroke-width="47"/>'+human(345,145,"#ad7385",.8)+human(413,143,"#7596a8",.79);break;
default:art=tree+'<path d="M255 112Q303 92 307 131Q363 90 414 112V202Q345 180 307 208Q274 183 255 202Z" fill="#fff9eb" stroke="#91765d" stroke-width="3"/>';break
}
return `<div class="scene"><svg viewBox="0 0 600 245" role="img" aria-label="Contextual illustration">${bg}${art}</svg><div class="caption">${esc(current().context)}</div></div>`
}
function renderWords(t){return(spell(t).match(/[\p{L}\p{M}]+|[^\p{L}\p{M}]+/gu)||[]).map(w=>/^[\p{L}\p{M}]/u.test(w)?`<button class="word" data-word="${esc(w)}">${esc(w)}</button>`:esc(w)).join("")}
function tabs(){const t=[["read","Lectiō"],["quiz","Exercitia"],["review","Memoria"],["library","Bibliothēca"],["progress","Progressus"]];$("tabs").innerHTML=t.map(([id,n])=>`<button class="${S.tab===id?"active":""}" data-tab="${id}">${n}</button>`).join("");$("chapters").innerHTML='<div class="mini" style="margin:5px 9px 14px">Liber prīmus</div>'+L.map((c,i)=>`<button class="ch ${S.ch===i?"active":""}" data-ch="${i}"><strong>${i+1}</strong><span><strong>${esc(c.name)}</strong><small>${esc(c.sub)}</small></span></button>`).join("")+(S.custom?`<button class="ch ${S.ch==="custom"?"active":""}" data-ch="custom">✧ Textus meus</button>`:"");$("audioMode").textContent=mode()==="voice"?"Browser voice (not a verified recording)":mode()==="timed"?"Imported audio — timed":"Imported audio — unsynchronized";$("audioNote").textContent=mode()==="untimed"?"Sentence clicks select only. Play does not seek.":mode()==="timed"?"Time boundaries come from your imported JSON.":"Browser voices may not pronounce Classical Latin correctly."}
function help(){const w=dict[norm(chosenWord)];$("help").innerHTML=`<div class="mini">Dux discendī</div><h3>Learn through context</h3><p class="subtle" style="font-size:12px">Look at the illustration, read the Latin, and ask for help only when necessary.</p><div class="mini" style="margin-top:18px">Verbum electum</div><div class="panel">${chosenWord?`<h3>${esc(spell(chosenWord))}</h3>${w?`<p>${esc(w.meaning)}</p><small>Headword: ${esc(spell(w.head))}</small><div class="tools"><button class="btn primary" data-save="${esc(norm(w.head))}">Save vocabulary</button></div>`:'<small>Not present in the small starter dictionary.</small>'} `:'<small>Click a word to see a short meaning.</small>'}</div><div class="tools"><button class="btn" data-action="macrons">${S.macrons?"Āā Macrons":"Aa No macrons"}</button><button class="btn" data-action="guide">${S.guided?"Guidance on":"Guidance off"}</button></div>${S.guided?`<details><summary>Grammar guide</summary><p style="font-size:12px">${esc(current().explain)}</p></details>`:""}<div class="mini" style="margin-top:19px">Notae meae</div><textarea class="field" id="notes" placeholder="Personal notes...">${esc(S.notes[String(S.ch)]||"")}</textarea><small>Saved locally if your browser permits storage.</small>`}
function reader(){const c=current();let h=`<div class="mini">Lectiō ${S.ch==="custom"?"propria":S.ch+1}</div><h1>${esc(c.name)}</h1><div class="subtle">${esc(c.sub)}</div>${scene(c.scene)}<div class="note">Read Latin first. Click unfamiliar words, or reveal a sentence translation only when necessary.</div><div class="tools"><button class="btn primary" data-action="play">▶ Speak / play selected</button><button class="btn" data-tab="quiz">Questions →</button></div>`;c.sent.forEach(([latin,en],i)=>{const k=S.ch+":"+i;h+=`<article class="sentence ${S.sel===i?"selected":""}"><div class="mini">Sententia ${i+1}</div><div class="words" data-sentence="${i}">${renderWords(latin)}</div><div class="tools"><button class="link" data-sentence="${i}">○ Select / listen</button>${en?`<button class="link" data-hint="${i}">${S.translations[k]?"Hide English":"Need a hint?"}</button>`:""}</div>${en&&S.translations[k]?`<div class="help">${esc(en)}</div>`:""}</article>`});h+=`<div class="tools"><button class="btn" data-action="prevChapter">Previous lesson</button><button class="btn primary" data-tab="quiz">Check comprehension →</button></div>`;return h}
function answer(i,value){const c=current(),q=c.q[i];if(!q)return;const k=S.ch+":"+i;S.answers[k]=value;if(norm(value)===norm(q[2]))S.correct[k]=true;save();render()}
function quiz(){const c=current();let h=`<div class="mini">Intellege et responde</div><h1>Exercitia</h1><p class="subtle">Answer primarily in Latin. Use the story to check your understanding.</p>`;if(!c.q.length)return h+'<div class="note">No verified answer key exists for this imported text.</div>';c.q.forEach((q,i)=>{const k=S.ch+":"+i,ok=!!S.correct[k],v=S.answers[k]||"";h+=`<div class="quiz"><div class="mini">${q[1]?"Elige":"Scribe"} · ${i+1} / 3</div><div class="question">${esc(spell(q[0]))}</div>`;if(q[1])h+=q[1].map(o=>`<button class="option" data-choice="${i}" data-value="${esc(o)}">${esc(spell(o))}</button>`).join("");else h+=`<div class="tools"><input class="field" id="answer-${i}" value="${esc(v)}" ${ok?"disabled":""} placeholder="Respondē Latīnē…"><button class="btn primary" data-check="${i}" ${ok?"disabled":""}>Check</button></div>`;if(v||ok)h+=`<div class="${ok?"good":"bad"}">${ok?"Rectē! "+esc(q[3]):"Not quite. Re-read the relevant passage and try again."}</div>`;h+='</div>'});return h+'<div class="tools"><button class="btn" data-tab="read">Read again</button><button class="btn primary" data-action="nextChapter">Next chapter →</button></div>'}
function dueEntries(){return Object.entries(S.vocab).filter(([k,v])=>v.due<=Date.now())}
function review(){const saved=Object.entries(S.vocab),due=dueEntries();let h=`<div class="mini">Memoria</div><h1>Vocabulary review</h1><p class="subtle">Save words by selecting them in a lesson. This is a simple interval scheduler, not FSRS.</p><div class="stats"><div class="stat"><b>${saved.length}</b><small>Saved</small></div><div class="stat"><b>${due.length}</b><small>Due</small></div><div class="stat"><b>${saved.length-due.length}</b><small>Later</small></div></div>`;if(!saved.length)return h+'<div class="panel">No saved vocabulary yet. Select a Latin word and click Save vocabulary.</div>';if(!due.length)return h+'<div class="panel">Omnia bene! No words are due right now.</div>';if(!reviewKey||!S.vocab[reviewKey]||S.vocab[reviewKey].due>Date.now())reviewKey=due[0][0];const w=S.vocab[reviewKey];h+=`<div class="panel" style="text-align:center;padding:30px"><div class="mini">Quid significat?</div><h1 style="font-size:38px">${esc(spell(w.head))}</h1>${S.revealCard?`<h2>${esc(w.meaning)}</h2><div class="tools" style="justify-content:center"><button class="btn" data-rating="again">Again</button><button class="btn" data-rating="hard">Hard</button><button class="btn primary" data-rating="good">Good</button><button class="btn" data-rating="easy">Easy</button></div>`:'<button class="btn primary" data-action="revealCard">Reveal meaning</button>'}</div>`;return h}
function library(){return `<div class="mini">Bibliothēca</div><h1>Reading and audio library</h1><p class="subtle">Import a Latin text you may legally use. This standalone prototype currently accepts plain text, not EPUB, TEI or PDF.</p><div class="panel"><h2>Textus meus</h2><div class="tools"><label class="btn">Select .txt<input type="file" id="textFile" accept=".txt,text/plain" style="display:none"></label><button class="btn" data-action="clearText">Clear</button></div><textarea id="customText" class="field" style="min-height:170px" placeholder="Paste your Latin text...">${esc(S.custom||"")}</textarea><div class="tools"><button class="btn primary" data-action="importText">Open imported text</button></div><small>Up to 20,000 characters. Split by punctuation; corrections to splitting are not yet supported.</small></div><div class="panel"><h2>Local audio</h2><div class="tools"><label class="btn">Attach MP3/WAV<input type="file" id="audioFile" accept="audio/*" style="display:none"></label><label class="btn">Load interval JSON<input type="file" id="timingFile" accept=".json,application/json" style="display:none"></label><button class="btn" data-action="clearAudio">Use browser voice</button></div><small>${esc(audioName||"No audio loaded.")} ${audioURL?mode()==="timed"?"(timed)":"(untimed)":""}</small><p class="subtle" style="font-size:12px">Timed playback requires one measured start/end interval for every sentence, in story order. Without valid intervals, sentence selection never seeks.</p></div><details><summary>Timing JSON format</summary><pre style="white-space:pre-wrap;font-size:12px">[{"start":0.5,"end":2.9},{"start":3.0,"end":5.8}]</pre><small>Example for a story of two sentences. Do not invent intervals.</small></details><div class="note">Planned, not implemented: LatinCy, Whitaker, Lewis & Short, Perseus text imports, Vox Classica catalogue, WaveSurfer editing, aeneas alignment and TS-FSRS.</div>`}
function progress(){const done=Object.values(S.correct).filter(Boolean).length,full=L.filter((c,i)=>c.q.every((q,j)=>S.correct[i+":"+j])).length;let h=`<div class="mini">Progressus</div><h1>Learning progress</h1><div class="stats"><div class="stat"><b>${full}/8</b><small>Chapters</small></div><div class="stat"><b>${done}/24</b><small>Correct</small></div><div class="stat"><b>${Object.keys(S.vocab).length}</b><small>Saved words</small></div></div><h2>Course map</h2>`;L.forEach((c,i)=>{const n=c.q.filter((q,j)=>S.correct[i+":"+j]).length;h+=`<div style="padding:9px 0;border-bottom:1px solid #dfe8dc"><div class="tools" style="justify-content:space-between"><button class="link" data-ch="${i}">${i+1}. ${esc(c.name)}</button><small>${n}/3</small></div><div class="bar"><div style="width:${n/3*100}%"></div></div></div>`});h+=`<h2>Backups</h2><p class="subtle">Export or restore your local progress. Audio files are not stored in backups.</p><div class="tools"><button class="btn primary" data-action="export">Export progress JSON</button><label class="btn">Restore backup<input type="file" accept=".json" id="restoreFile" style="display:none"></label></div><details><summary>Reset progress</summary><button class="btn" data-action="reset">Clear progress and saved vocabulary</button></details>`;return h}
function render(){tabs();help();$("main").innerHTML=S.tab==="read"?reader():S.tab==="quiz"?quiz():S.tab==="review"?review():S.tab==="library"?library():progress()}
function setChapter(id){clearAudio();S.ch=id;S.sel=0;S.tab="read";S.translations={};chosenWord="";save();render()}
function switchTab(id){clearVoice();S.tab=id;save();render()}
function selectSentence(i,activate){S.sel=Math.max(0,Math.min(i,current().sent.length-1));save();render();if(activate){if(mode()==="voice")speak();else if(mode()==="timed")play();}}
function speak(){clearVoice();const line=current().sent[S.sel];if(!line)return;if(!("speechSynthesis" in window)){alert("Speech synthesis is not available.");return}const n=++speechSerial,u=new SpeechSynthesisUtterance(line[0]);u.lang="la";u.rate=.82;const voices=speechSynthesis.getVoices();const latin=voices.find(v=>v.lang.toLowerCase().startsWith("la"));if(latin)u.voice=latin;u.onend=()=>{if(n===speechSerial){}};speechSynthesis.speak(u)}
function play(){if(mode()==="voice"){speak();return}if(mode()==="timed"&&ranges[S.sel])audio.currentTime=ranges[S.sel].start;audio.play().catch(()=>alert("Could not play the attached audio."))}
function rate(r){const item=S.vocab[reviewKey];if(!item)return;let d=item.days||1;if(r==="again")d=1/1440;else if(r==="hard")d=Math.max(1,Math.round(d*1.2));else if(r==="good")d=Math.max(2,Math.round(d*2.2));else d=Math.max(4,Math.round(d*3.2));item.days=d;item.due=Date.now()+d*86400000;item.reps=(item.reps||0)+1;S.revealCard=false;reviewKey=null;save();render()}
function download(name,content,type){const b=new Blob([content],{type:type||"application/json"}),url=URL.createObjectURL(b),a=document.createElement("a");a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function fileInput(file,kind){const reader=new FileReader();reader.onload=()=>{try{if(kind==="text"){S.custom=String(reader.result).slice(0,20000);save();render()}else if(kind==="timing"){const data=JSON.parse(reader.result),a=Array.isArray(data)?data:data.intervals;if(!audioURL||!Array.isArray(a)||a.length!==current().sent.length)throw Error("Attach audio first and supply one interval per sentence.");let previous=-1;const tested=a.map(x=>({start:Number(x.start),end:Number(x.end)}));for(const t of tested){if(!Number.isFinite(t.start)||!Number.isFinite(t.end)||t.start<0||t.end<=t.start||t.start<previous)throw Error("Invalid or overlapping timing values.");previous=t.end}if(Number.isFinite(audio.duration)&&audio.duration>0&&previous>audio.duration+.5)throw Error("Intervals extend beyond the recording.");ranges=tested;render()}else if(kind==="backup"){const d=JSON.parse(reader.result);if(d.app!=="tablinum-v02"||typeof d.state!=="object")throw Error("Not a compatible backup.");if(!confirm("Replace local progress with this backup?"))return;clearAudio();S={...base,...d.state};save();render()}}catch(e){alert(e.message||"Import failed.")}};reader.readAsText(file)}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.tab){switchTab(b.dataset.tab);return}if(b.dataset.ch){setChapter(b.dataset.ch==="custom"?"custom":Number(b.dataset.ch));return}if(b.dataset.word){chosenWord=b.dataset.word;render();return}if(b.dataset.sentence!==undefined){selectSentence(Number(b.dataset.sentence),true);return}if(b.dataset.hint!==undefined){const k=S.ch+":"+b.dataset.hint;S.translations[k]=!S.translations[k];save();render();return}if(b.dataset.save){const w=dict[b.dataset.save];if(w){S.vocab[b.dataset.save]??={head:w.head,meaning:w.meaning,days:1,due:Date.now(),reps:0};save();render()}return}if(b.dataset.choice!==undefined){answer(Number(b.dataset.choice),b.dataset.value);return}if(b.dataset.check!==undefined){const n=Number(b.dataset.check);answer(n,$("answer-"+n)?.value||"");return}if(b.dataset.rating){rate(b.dataset.rating);return}switch(b.dataset.action){
case"macrons":S.macrons=!S.macrons;save();render();break;
case"guide":S.guided=!S.guided;save();render();break;
case"play":play();break;
case"pause":clearVoice();audio.pause();break;
case"previous":selectSentence(S.sel-1,false);break;
case"forward":selectSentence(S.sel+1,false);break;
case"prevChapter":setChapter(Math.max(0,Number(S.ch||0)-1));break;
case"nextChapter":setChapter(Math.min(7,Number(S.ch||0)+1));break;
case"revealCard":S.revealCard=true;render();break;
case"importText":{const t=$("customText")?.value||"";if(!t.trim())return alert("Paste text first.");S.custom=t.slice(0,20000);save();setChapter("custom");break}
case"clearText":if(confirm("Clear your imported text?")){S.custom="";if(S.ch==="custom")S.ch=0;save();render()}break;
case"clearAudio":clearAudio();render();break;
case"export":download("tablinum-progress.json",JSON.stringify({app:"tablinum-v02",version:2,state:S},null,2));break;
case"reset":if(confirm("Reset progress and saved words?")){S.correct={};S.answers={};S.vocab={};save();render()}break
}});
document.addEventListener("change",e=>{const t=e.target,f=t.files?.[0];if(!f)return;if(t.id==="textFile")fileInput(f,"text");if(t.id==="timingFile")fileInput(f,"timing");if(t.id==="restoreFile")fileInput(f,"backup");if(t.id==="audioFile"){clearAudio();audioURL=URL.createObjectURL(f);audio.src=audioURL;audioName=f.name;render()}});
document.addEventListener("input",e=>{if(e.target.id==="notes"){S.notes[String(S.ch)]=e.target.value;save()}});
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id?.startsWith("answer-")){e.preventDefault();answer(Number(e.target.id.slice(7)),e.target.value)}});
audio.addEventListener("timeupdate",()=>{if(mode()!=="timed")return;const i=ranges.findIndex(t=>audio.currentTime>=t.start&&audio.currentTime<t.end);if(i>=0&&i!==S.sel){S.sel=i;save();if(S.tab==="read")render()}});
render();
})();
</script>
</body>
</html>
